<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#12171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Custodia">
<meta name="robots" content="noindex">
<title>Custodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spectral:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2312171A'/%3E%3Ctext x='90' y='112' font-family='Georgia,serif' font-size='96' fill='%239095E4' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg0:#12171A;--bg1:#191F23;--bg2:#212A2E;--line:#2B3539;--line2:#3C484C;
  --tx:#EDF0EE;--tx2:#AAB4B5;--tx3:#838E90;
  --stamp:#9095E4;--stampbg:rgba(144,149,228,.13);--stampln:rgba(144,149,228,.32);
  --ok:#6FB392;--okbg:rgba(111,179,146,.13);
  --warn:#D3A155;--warnbg:rgba(211,161,85,.14);
  --stop:#C67F70;--stopbg:rgba(198,127,112,.15);--stopln:rgba(198,127,112,.42);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg0);color:var(--tx);font-family:Archivo,system-ui,sans-serif;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) 20px 12px}
.nav .back{border:0;background:none;padding:0 4px 0 0;font:inherit;font-size:23px;color:var(--stamp);line-height:1}
.nav .title{font-size:15.5px;font-weight:500}
.nav .sub{font-size:11.5px;color:var(--tx3);margin-left:auto;letter-spacing:.14em}
.brand{font-family:Spectral,serif;font-size:23px;font-weight:300}
.view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px;scrollbar-width:none}
.view::-webkit-scrollbar{width:0}
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--bg1);padding-bottom:calc(var(--sab) + 4px)}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:10.5px;color:var(--tx3);
  padding:11px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
.tabs button[aria-current="true"]{color:var(--stamp)}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:17px 18px}
.card.up{background:var(--bg2)}
.card.stop{background:var(--stopbg);border-color:var(--stopln)}
.k{font-size:11.5px;color:var(--tx3);letter-spacing:.13em}
.amount{font-family:Spectral,serif;font-weight:300;font-variant-numeric:tabular-nums}
.plate{display:inline-block;border:1px solid var(--line2);border-radius:2px;padding:3px 8px;
  font-size:11px;letter-spacing:.2em;color:var(--tx2);background:rgba(255,255,255,.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.chip{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:2px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.now{background:var(--warnbg);color:var(--warn)}
.chip.wait{background:var(--bg2);color:var(--tx2)}.chip.st{background:var(--stampbg);color:var(--stamp)}
.chip.no{background:var(--stopbg);color:var(--stop)}
.rule{height:1px;background:var(--line);margin:18px 0}
.btn{width:100%;font:inherit;font-size:16px;padding:16px;border-radius:7px;border:1px solid var(--stamp);
  background:var(--stamp);color:#141731;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset;
  transition:transform .12s ease,filter .12s ease}
.btn:active{transform:translateY(1px);filter:brightness(.94)}
.btn.quiet{box-shadow:none;font-weight:500}
.cta .btn+.btn,.cta>div+div,.cta>.btn+div,.cta>div+.btn{margin-top:9px}
.cta .btn{margin-bottom:0}
.btn.ghost{background:none;color:var(--stamp);font-weight:400}
.btn.quiet{background:none;color:var(--tx2);border-color:var(--line2)}
/* ---- accion principal, fija abajo ---- */
.cta{position:sticky;bottom:0;z-index:5;margin:26px -20px 0;
  padding:66px 20px calc(12px + var(--sab));pointer-events:none;
  background:linear-gradient(to top,var(--bg0) 0,var(--bg0) 52%,rgba(18,23,26,.92) 66%,rgba(18,23,26,.55) 84%,rgba(18,23,26,0) 100%)}
.cta>*{pointer-events:auto}
.btn.go{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;padding:16px;
  border-radius:7px;background:var(--stamp);color:#141731;border-color:var(--stamp)}
.btn.go svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.ctanote{font-size:12px;color:var(--tx3);text-align:center;margin-top:9px;line-height:1.45}
/* ---- pulido general ---- */
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;border-radius:0 0 2px 2px;background:var(--stamp)}
.tabs button{transition:color .15s ease}
.ccard{transition:border-color .15s ease,transform .12s ease}
.ccard:active,.gcard:active{transform:scale(.993)}
.gcard{transition:border-color .15s ease,transform .12s ease}
.row{transition:background .12s ease}
.row:active{background:rgba(255,255,255,.022)}
.phase{display:flex;align-items:center;gap:12px}
.phase::after{content:"";flex:1;height:1px;background:var(--line)}
.chip{border-radius:3px;font-weight:500;letter-spacing:.01em}
.srch:focus{outline:none;border-color:var(--stampln);background:var(--bg2)}
.lnk{border:0;background:none;font:inherit;color:var(--stamp);text-decoration:underline;cursor:pointer;padding:0}
.pp{font-size:11.5px;white-space:nowrap;letter-spacing:.02em}
.lab{font-size:10.5px;letter-spacing:.14em;color:var(--tx3);margin:16px 0 0}
.sortbar button b{color:var(--tx2)}
.sortbar button[aria-current="true"] b{color:var(--stamp)}
.vsw button{transition:background .12s ease,color .12s ease}
.btn.stop{background:none;color:var(--stop);border-color:var(--stopln)}
.row{display:flex;align-items:center;gap:14px;padding:16px 0;line-height:1.35;border:0;border-bottom:1px solid var(--line);
  text-align:left;width:100%;background:none;font:inherit;color:var(--tx)}
.mark{width:17px;height:17px;border-radius:50%;border:1px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#12171A}
.mark.ok{background:var(--ok);border-color:var(--ok)}.mark.now{background:var(--warn);border-color:var(--warn)}
.mark.no{background:var(--stop);border-color:var(--stop)}
.reg{display:flex;gap:3px}
.reg i{display:block;height:3px;background:var(--line2);border-radius:1px;flex:1;transition:background .3s}
.reg i.f{background:var(--warn)}.reg i.d{background:var(--ok)}.reg i.x{background:var(--stop)}
.phase{font-family:Spectral,serif;font-size:15px;color:var(--tx2);letter-spacing:.1em;margin:28px 0 4px}
.ref{letter-spacing:.1em;font-size:11.5px;color:var(--tx3)}
.log{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--tx2)}
.log time{color:var(--tx3);font-size:11.5px;line-height:1.5;letter-spacing:.04em}
.log b{color:var(--tx);font-weight:400}
h2.sc{font-family:Spectral,serif;font-weight:300;font-size:30px;margin:6px 0 5px;line-height:1.18}
p.lede{margin:0 0 20px;font-size:15.5px;color:var(--tx2);line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;line-height:1.4;font-size:15px;color:var(--tx2);border-bottom:1px solid var(--line)}
.kv b{color:var(--tx);font-weight:400;text-align:right}
.cert{border:1px solid var(--line2);border-radius:6px;padding:3px;
  background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(144,149,228,.05) 7px 8px)}
.cert-in{border:1px solid var(--line2);border-radius:4px;background:var(--bg1);padding:30px 18px;text-align:center}
.seal{width:76px;height:76px;border-radius:50%;border:1px solid var(--stampln);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;color:var(--stamp);font-size:11px;letter-spacing:.1em;background:var(--stampbg)}
.hero{position:relative;margin:2px -20px 0;padding:6px 20px 12px;
  background:radial-gradient(120% 90% at 50% 30%, rgba(144,149,228,.09), transparent 70%)}
.hero svg{width:100%;height:auto;display:block}
.thumb{width:74px;flex:0 0 auto;opacity:.85}
.inp,.sel{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:5px;
  border:1px solid var(--line2);background:var(--bg1);color:var(--tx);margin-top:7px}
.inp::placeholder{color:var(--tx3)}
.sel{appearance:none;-webkit-appearance:none}
.opt{width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--bg1);
  border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px}
.opt[aria-pressed="true"]{border-color:var(--stamp);background:var(--stampbg)}
.steps{display:flex;gap:4px;margin:4px 0 18px}
.steps i{flex:1;height:2px;background:var(--line2);border-radius:1px}
.steps i.on{background:var(--stamp)}
.err{color:var(--stop);font-size:14px;margin-top:12px;line-height:1.5}
.two{display:flex;gap:10px;align-items:flex-end}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px}
@media (prefers-reduced-motion:no-preference){
  .in{animation:in .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* ---- perfil del coleccionista ---- */
.prof{display:flex;align-items:center;gap:16px;padding:14px 0 18px}
.pname{font-family:Spectral,serif;font-weight:300;font-size:26px;line-height:1.15}
.psub{font-size:13.5px;color:var(--tx3);margin-top:4px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 22px}
.stats div{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:11px 6px 10px;text-align:center}
.stats b{display:block;font-family:Spectral,serif;font-weight:300;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10.5px;color:var(--tx3);margin-top:5px;letter-spacing:.04em}
.note{font-size:13.5px;color:var(--tx3);line-height:1.6;margin-top:12px}
.cardtx{font-size:15.5px;line-height:1.55;margin:9px 0 16px;color:var(--tx)}
.amount.big{font-size:44px;line-height:1.05;margin:8px 0 6px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 14px;padding:0 20px}
.pills::-webkit-scrollbar{width:0;height:0}
.pill{flex:0 0 auto;border:1px solid var(--line2);background:none;color:var(--tx2);font:inherit;font-size:13.5px;padding:7px 14px;border-radius:16px}
.pill[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp);background:var(--stampbg)}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-top:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:11px 0;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--stampbg);color:var(--stamp)}
.ccard{display:block;width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg1);margin:0 0 14px;padding:0;text-align:left;font:inherit;color:var(--tx)}
.cimg{position:relative;background:#14191C;line-height:0;aspect-ratio:16/9;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg.hero2{aspect-ratio:auto}
.cimg svg,.cimg img{display:block;width:100%;height:auto}
.cchip{position:absolute;top:12px;left:12px;line-height:1.3;background:rgba(12,16,18,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);
  border-radius:4px;padding:0}
.cchip .chip{background:none!important;padding:4px 9px}
.cmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:14px 16px 12px;line-height:1.3}
.cname{font-size:17px}
.csub{font-size:13px;color:var(--tx3);margin-top:4px}
.cval{font-size:19px;white-space:nowrap;padding-top:2px}
/* ---- badges del toolbar ---- */
.tabs button{position:relative}
.tabs .ico{position:relative;display:block;line-height:0}
.badge{position:absolute;top:-7px;left:12px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--stamp);color:#12171A;font-size:10.5px;font-weight:600;line-height:17px;text-align:center;
  font-family:Inter,system-ui,sans-serif;letter-spacing:0}
/* ---- campana de avisos ---- */
.bell{position:relative;margin-left:auto;border:0;background:none;padding:6px;color:var(--tx2);line-height:0;cursor:pointer}
.bell svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4}
.bell .badge{top:0;left:auto;right:0}
/* ---- barra de herramientas de la coleccion ---- */
.tools{display:flex;gap:8px;align-items:stretch;margin:14px 0 0}
.srch{flex:1;min-width:0;height:40px;box-sizing:border-box;background:var(--bg1);
  border:1px solid var(--line2);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;color:var(--tx)}
.srch::placeholder{color:var(--tx3)}
.vsw{display:flex;height:40px;box-sizing:border-box;margin:0;flex:0 0 auto;
  border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.vsw button{border:0;background:none;margin:0;width:38px;display:flex;align-items:center;
  justify-content:center;color:var(--tx3);line-height:0;cursor:pointer}
.vsw button+button{border-left:1px solid var(--line2)}
.vsw button[aria-current="true"]{background:var(--stampbg);color:var(--stamp)}
.vsw svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.ftabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--line);margin:22px 0 0}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:0 0 auto;border:0;background:none;padding:10px 15px 11px;font:inherit;font-size:13.5px;
  color:var(--tx3);white-space:nowrap;position:relative;cursor:pointer;transition:color .14s ease}
.ftabs button:first-child{padding-left:0}
.ftabs button[aria-current="true"]{color:var(--tx)}
.ftabs button::after{content:"";position:absolute;left:15px;right:15px;bottom:-1px;height:2px;
  background:var(--stamp);opacity:0;transition:opacity .14s ease}
.ftabs button:first-child::after{left:0}
.ftabs button[aria-current="true"]::after{opacity:1}
.ftabs b{font-weight:600;margin-left:6px;color:var(--tx3)}
.ftabs button[aria-current="true"] b{color:var(--stamp)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px}
.cnt{font-size:12.5px;color:var(--tx3);margin:0}
.ord{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.ord select{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:var(--bg1);
  border-radius:6px;padding:5px 26px 5px 10px;font:inherit;font-size:12.5px;color:var(--tx2);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.ord select:focus{outline:none;border-color:var(--stampln)}
/* ---- mosaico ---- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.gcard{display:block;width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--bg1);padding:0;text-align:left;font:inherit;color:var(--tx)}
.gcard .cimg{aspect-ratio:16/9}
.gcard .cimg img{width:100%;height:100%;object-fit:cover}
.gmeta{padding:9px 10px 10px}
.gname{font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsub{font-size:11.5px;color:var(--tx3);margin-top:3px}
.gval{font-size:14px;margin-top:5px}
.gdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
/* ---- fila compacta ---- */
.crow{display:flex;align-items:center;gap:11px;padding:11px 0;border:0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:none;font:inherit;color:var(--tx)}
.crow .th{width:56px;flex:0 0 auto;border-radius:4px;overflow:hidden;background:#14191C;line-height:0;aspect-ratio:16/9}
.crow .th img{width:100%;height:100%;object-fit:cover}
/* ---- notificaciones ---- */
.ntf{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border:0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:none;font:inherit;color:var(--tx)}
.ntf .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:7px;background:var(--stamp)}
.ntf.read .dot{background:transparent;border:1px solid var(--line2)}
.ntf .tx{flex:1;min-width:0}
.ntf .t1{font-size:15px;line-height:1.35;display:block}
.ntf .t2{font-size:13px;color:var(--tx3);margin-top:3px;display:block}
.ntf .when{font-size:11.5px;color:var(--tx3);white-space:nowrap;margin-top:2px}
.ntf.read .t1{color:var(--tx2)}
.hero2{margin:4px -20px 18px;border-radius:0}
.plate-ov{position:absolute;left:20px;bottom:12px;background:rgba(18,23,26,.8);line-height:1.6}
.ref-ov{position:absolute;right:20px;bottom:15px;color:var(--tx2);line-height:1.6}
.thumb2{width:84px;flex:0 0 auto;border-radius:5px;overflow:hidden;background:#14191C;line-height:0;aspect-ratio:16/9}
.thumb2 img{width:100%;height:100%;object-fit:cover}
.rtx{flex:1;min-width:0}
.rn{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12.5px;color:var(--tx3);margin-top:3px;line-height:1.35}
.row>.chip{flex:0 0 auto;align-self:center}
.thumb2 svg,.thumb2 img{display:block;width:100%;height:auto}
.stage{position:relative;border-radius:10px;overflow:hidden;perspective:700px;margin-top:10px;line-height:0}
.stage svg{display:block;width:100%;height:auto}
#rot{transition:transform .15s}
.mark3d{position:absolute;width:16px;height:16px;border:1.5px solid var(--stop);border-radius:50%;box-shadow:0 0 0 5px rgba(198,127,112,.2)}
.msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.5;margin:8px 0;color:var(--tx)}
.msg.me{margin-left:auto;background:var(--stampbg);border-bottom-right-radius:3px}
.msg.them{background:var(--bg2);border-bottom-left-radius:3px}
.msg time{display:block;font-size:11px;color:var(--tx3);margin-top:5px;letter-spacing:.05em}
.sealed{font-size:11.5px;color:var(--tx3);letter-spacing:.06em;margin-top:4px;line-height:1.5}
.sealed:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--stamp);margin-right:7px;vertical-align:1px}
input[type=range]{width:100%;accent-color:#9095E4;margin:14px 0 2px}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 30px}
/* ---- portada ---- */
.portada{position:relative;min-height:100%;box-sizing:border-box;margin:0 -20px;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.portada-img{position:absolute;inset:0;line-height:0}
.portada-img img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  filter:saturate(.78) contrast(1.04)}
.portada-img::after{content:"";position:absolute;inset:0;

   <div style="font-size:14.5px;color:var(--stamp);line-height:1.65">Comprador: colección privada alemana con museo abierto al público. Exige expediente completo antes de pagar, por su propia política interna.</div></div>`};

S.arancel={tab:'op',back:'pieza2',title:'Aduana',sub:'ETAPA 6',html:`
 <h2 class="sc in">Cómo entra en Europa</h2>
 <p class="lede">La partida arancelaria decide miles de euros. En piezas de colección no es evidente y conviene preguntarlo antes de embarcar.</p>
 <div class="card up" style="border-color:var(--stampln)">
   <div class="k" style="color:var(--stamp)">CLASIFICACIÓN PROPUESTA</div>
   <div style="font-size:16px;margin:9px 0 4px">9705, objeto de colección</div>
   <div style="font-size:14.5px;color:var(--tx2);line-height:1.65">Pieza de interés histórico, conservada en estado original y destinada a una colección con museo. Arancel cero.</div>
 </div>
 <div style="height:12px"></div>
 <div class="card up">
   <div class="k">ALTERNATIVA SI SE RECHAZA</div>
   <div style="font-size:16px;margin:9px 0 4px">8708, parte de vehículo</div>
   <div style="font-size:14.5px;color:var(--tx2);line-height:1.65">Tratada como recambio corriente. Arancel ordinario y tipo general de IVA en destino.</div>
 </div>
 <div style="height:14px"></div>
 <div class="card">
   <div class="kv"><span>Diferencia estimada</span><b class="amount" style="font-size:16px;color:var(--warn)">€9.400</b></div>
   <div class="kv" style="border-bottom:0"><span>Quién la asume si sale mal</span><b>comprador, por contrato</b></div>
 </div>
 <div class="phase">QUÉ SE HA HECHO</div>
 <div class="log"><time>3 SEP</time><div><b>Consulta vinculante presentada</b> a la aduana alemana<div style="color:var(--tx3);font-size:13px;margin-top:3px">respuesta estimada en 30 días</div></div></div>
 <div class="log"><time>3 SEP</time><div>Expediente de procedencia adjuntado a la consulta</div></div>
 <div class="log" style="border-bottom:0"><time>PEND</time><div style="color:var(--tx2)">No se embarca hasta tener respuesta</div></div>
 <div class="rule"></div>
 <div class="card" style="border-color:var(--stampln);background:var(--stampbg)">
   <div style="font-size:14.5px;color:var(--stamp);line-height:1.65">Es exactamente el expediente de procedencia el que sostiene la clasificación como objeto de colección. El mismo trabajo sirve para dos cosas.</div></div>`};

S.procedencia={tab:'op',back:'expediente',title:'Procedencia',sub:'ETAPA 3',html:`
 <h2 class="sc in">Procedencia</h2>
 <p class="lede">Todo lo que sostiene el precio. Cada documento queda sellado con fecha y con quién lo aportó.</p>
 ${doc('Ficha de identidad FIVA','n.º 30412, inspección de 2024','ok','Verificado')}
 ${doc('Certificado Ferrari Classiche','carrocería y caja originales','ok','Verificado')}
 ${doc('Libro de servicio','1965 a 2019, 312 páginas','ok','Verificado')}
 ${doc('Factura original Chinetti','Nueva York, marzo de 1966','ok','Verificado')}
 ${doc('Inspección independiente','taller especialista, Módena','st','En revisión')}
 ${doc('Historial de competición','Targa Florio 1967, sin acreditar','wait','Falta')}
 <div class="rule"></div>
 <div class="card"><div class="k">EFECTO SOBRE EL PRECIO</div>
   <div style="font-size:14.5px;color:var(--tx2);margin-top:9px;line-height:1.65">El coche se vende sin su motor original, y así consta en el contrato. El motor está localizado y en venta por separado.</div></div>`};

S.documento={tab:'op',back:'procedencia',title:'Documento',sub:'FIVA 30412',html:`
 <div class="cert in" style="margin:10px 0 22px"><div class="cert-in">

S.contrato={tab:'op',back:'expediente',title:'Contrato',sub:'ETAPA 5',html:`

S.aduana={tab:'op',back:'expediente',title:'Aduana',sub:'ETAPAS 7 Y 8',html:`

  <div class="kv"><span>Arancel</span><b class="amount">5%</b></div>
  <div class="kv"><span>IVA de importación</span><b class="amount">15%</b></div>
  <div class="kv" style="border-bottom:0"><span>A cargo de</span><b>comprador</b></div></div>
 <div class="phase">SE GENERAN SOLOS</div>
 <div style="font-size:15px;line-height:2.3;color:var(--tx2)">Declaración de exportación<br>Factura comercial<br>Lista de bultos<br>Certificado de origen<br>Conocimiento de embarque</div>`};

S.fondos={tab:'op',title:'Fondos',sub:'2 CUENTAS',html:`
 <div class="cert in" style="margin:12px 0 20px"><div class="cert-in">

   <div class="ref">CUENTA DE CLIENTE, ALMEIDA E SOUSA</div>
   <div class="amount" style="font-size:44px;line-height:1.05;margin:14px 0 8px">€2.880.000</div>

   <div class="rule" style="margin:20px 0 15px"></div>

 <button class="row" onclick="go('pieza')"><span class="thumb" style="width:56px">${part('v12','#C67F70')}</span>

  <span class="amount" style="font-size:16px">€480.000</span></button>
 <div class="phase">MOVIMIENTOS</div>
 <div class="log"><time>4 SEP</time><div><b>Recepción de fondos</b>, Ferrari 275 GTB<div style="color:var(--tx3);font-size:13px;margin-top:3px">€2.400.000</div></div></div>

 <div class="log" style="border-bottom:0"><time>1 SEP</time><div>Retención por reclamación de terceros<div style="color:var(--stop);font-size:13px;margin-top:3px">salida bloqueada hasta dictamen</div></div></div>

 <div style="height:12px"></div>
 <div class="card"><div class="k">POR QUÉ NO LO GUARDAMOS NOSOTROS</div>
  <div class="cardtx" style="margin-bottom:0">Custodiar dinero de terceros exige licencia y capital, y obligaría al comprador a confiarnos millones antes de conocernos. El despacho lleva siglos haciéndolo, tiene colegio profesional y seguro. Nosotros ponemos el procedimiento.</div></div>`};

S.partes={tab:'op',back:'expediente',title:'Partes',sub:'PT SA 0117',html:`

const CTY={PT:'Portugal',ES:'España',IT:'Italia',CH:'Suiza',DE:'Alemania',GB:'Reino Unido',MX:'México',US:'Estados Unidos',SA:'Arabia Saudí',AE:'Emiratos'};
const CORR={
 'PT-SA':{dias:18,pasos:['Exportación definitiva desde la UE, exenta de IVA','Importación en Arabia Saudí, arancel 5% e IVA 15%'],aviso:'La exención de IVA decae si el vehículo no sale en plazo.',ter:'14.000 a 19.000'},
 'MX-US':{dias:12,pasos:['Pedimento de exportación y verificación del número de serie','Exención por antigüedad ante las agencias medioambiental y de transporte'],aviso:'La exención por antigüedad exige acreditar los años cumplidos con documento de fecha cierta.',ter:'4.000 a 7.000'},
 'MX-DE':{dias:21,pasos:['Exportación desde México','Importación en la UE, clasificación 9705 frente a 8708'],aviso:'Conviene pedir consulta vinculante de clasificación antes de embarcar. La diferencia es dinero real.',ter:'9.000 a 14.000'},
 'IT-SA':{dias:24,pasos:['Autorización de salida de bien de interés histórico','Importación en Arabia Saudí'],aviso:'Italia puede exigir autorización de exportación para bienes de interés histórico. Es el cuello de botella del corredor.',ter:'13.000 a 18.000'},
 'CH-ES':{dias:9,pasos:['Exportación desde Suiza','Importación en la UE, posible tipo reducido para objetos de colección'],aviso:'El tipo reducido no es automático, depende de la clasificación.',ter:'3.500 a 6.000'},
 'DE-MX':{dias:19,pasos:['Exportación desde la UE','Importación en México, pedimento y avalúo'],aviso:'El avalúo en destino puede discrepar del precio pactado. Se documenta antes de embarcar.',ter:'9.000 a 14.000'}
};
const TIPOS={
 vehiculo:{n:10,lbl:'Número de chasis',art:'gt',t:'Vehículo completo',d:'diez etapas, termina en matriculación'},
 pieza:{n:8,lbl:'Número interno o de serie',art:'v12',t:'Pieza o componente',d:'ocho etapas, con correspondencia'},
 lote:{n:12,lbl:'Referencia del lote',art:'gbox',t:'Lote o colección',d:'doce etapas, inventario unidad por unidad'}
};
const st={tipo:'vehiculo',desc:'',ref:'',ano:'',precio:'',moneda:'EUR',origen:'PT',destino:'SA',rol:'intermediario',vendedor:'',comprador:'',err:''};
const EXTRA=[];
function num(v){return parseInt(String(v).replace(/[^0-9]/g,''))||0}
function eur(){var p=num(st.precio);return st.moneda==='USD'?Math.round(p*0.92):p}
function money(n,m){return (m==='USD'?'$':'€')+n.toLocaleString('es-ES')}
function fee(){var p=eur();if(p<=1250000)return 7500;return Math.min(Math.round(p*0.006),30000)}
function corr(){return CORR[st.origen+'-'+st.destino]||{dias:'15 a 25',pasos:['Exportación en origen','Importación en destino'],aviso:'Corredor sin plantilla previa. Lo montamos a mano y te confirmamos plazos en 48 horas.',ter:'según destino'}}
function steps(n){var s='';for(var i=1;i<=5;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return s}
function err(){return st.err?'<div class="err">'+st.err+'</div>':''}
function next(from,to,ok,msg){if(!ok){st.err=msg;go(from);return}st.err='';go(to)}
function opts(sel){return Object.keys(CTY).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+CTY[k]+'</option>'}).join('')}
function pic(t){return t==='vehiculo'?car('gt'):part(TIPOS[t].art)}

S.alta1={tab:'op',back:'operaciones',title:'Nueva operación',html:()=>`
 <div class="steps in">${steps(1)}</div>
 <h2 class="sc">¿Qué se vende?</h2>
 <p class="lede">El expediente cambia entero según la respuesta. No es lo mismo un coche que un motor suelto.</p>
 ${Object.keys(TIPOS).map(function(k){var T=TIPOS[k];return `
 <button class="opt" aria-pressed="${st.tipo===k}" onclick="st.tipo='${k}';go('alta1')">
   <span class="thumb" style="width:60px">${pic(k)}</span>
   <span style="flex:1"><span style="font-size:16px">${T.t}</span><br>
   <span style="font-size:13.5px;color:var(--tx3)">${T.d}</span></span>
   ${st.tipo===k?'<span class="chip st">Elegido</span>':''}
 </button>`}).join('')}
 <div style="height:14px"></div>
 <button class="btn" onclick="go('alta2')">Continuar</button>`};

S.alta2={tab:'op',back:'alta1',title:'Identificación',html:()=>`
 <div class="steps in">${steps(2)}</div>
 <h2 class="sc">Qué es exactamente</h2>
 <p class="lede">Con esto abrimos el expediente. Los documentos se piden después, no ahora.</p>
 <div class="k">DESCRIPCIÓN</div>
 <input class="inp" value="${st.desc}" oninput="st.desc=this.value"
   placeholder="${st.tipo==='vehiculo'?'Ferrari 275 GTB alloy':st.tipo==='pieza'?'Motor original tipo 213/B':'Repuestos de competición, 14 lotes'}">
 <div style="height:16px"></div>
 <div class="two">
  <div><div class="k">${TIPOS[st.tipo].lbl.toUpperCase()}</div>
   <input class="inp" value="${st.ref}" oninput="st.ref=this.value" placeholder="07545"></div>
  <div><div class="k">AÑO</div>
   <input class="inp" inputmode="numeric" value="${st.ano}" oninput="st.ano=this.value" placeholder="1965"></div>
 </div>
 ${err()}
 <div style="height:20px"></div>
 <button class="btn" onclick="next('alta2',st.tipo==='lote'?'inventario':'alta3',st.desc.trim().length>2&&st.ref.trim().length>0,'Necesitamos al menos la descripción y el número de referencia.')">Continuar</button>
 <div style="height:12px"></div>
 <div style="font-size:13.5px;color:var(--tx3);line-height:1.65">Si no tienes el número a mano, escribe lo que sepas. Un expediente sin número identificador no se puede cerrar, pero sí abrir.</div>`};

S.alta3={tab:'op',back:'alta2',title:'Precio y recorrido',html:()=>`
 <div class="steps in">${steps(3)}</div>
 <h2 class="sc">Cuánto y adónde</h2>
 <p class="lede">El recorrido determina la mitad del trabajo. El precio determina las obligaciones legales.</p>
 <div class="k">PRECIO ACORDADO</div>
 <div class="two">
   <input class="inp" inputmode="numeric" style="flex:2" value="${st.precio}" oninput="st.precio=this.value" placeholder="2400000">
   <select class="sel" style="flex:1" onchange="st.moneda=this.value">
     <option value="EUR"${st.moneda==='EUR'?' selected':''}>EUR</option>
     <option value="USD"${st.moneda==='USD'?' selected':''}>USD</option>
   </select>
 </div>
 <div style="height:18px"></div>
 <div class="k">SALE DE</div>
 <select class="sel" onchange="st.origen=this.value;go('alta3')">${opts(st.origen)}</select>
 <div style="height:14px"></div>
 <div class="k">ENTRA EN</div>
 <select class="sel" onchange="st.destino=this.value;go('alta3')">${opts(st.destino)}</select>
 ${st.origen===st.destino?'<div class="err">Origen y destino son el mismo país. Si la operación es interna, el expediente se simplifica mucho.</div>':''}
 ${err()}
 <div style="height:20px"></div>
 <button class="btn" onclick="next('alta3','alta4',eur()>0,'Escribe el precio acordado, aunque sea aproximado.')">Continuar</button>`};

S.alta4={tab:'op',back:'alta3',title:'Las partes',html:()=>`
 <div class="steps in">${steps(4)}</div>
 <h2 class="sc">Las dos partes</h2>
 <p class="lede">Les mandamos la invitación nosotros. Tú no tienes que pedirles documentos.</p>
 <div class="k">VENDEDOR</div>
 <input class="inp" value="${st.vendedor}" oninput="st.vendedor=this.value" placeholder="Nombre o razón social">
 <div style="height:16px"></div>
 <div class="k">COMPRADOR</div>
 <input class="inp" value="${st.comprador}" oninput="st.comprador=this.value" placeholder="Nombre o razón social">
 <div style="height:18px"></div>

 <div class="cimg">${img(c)}${chipSt(c)?'<span class="cchip">'+chipSt(c)+'</span>':''}</div>
 <div class="cmeta"><div style="flex:1;min-width:0"><div class="cname">${c.name}</div><div class="csub">${c.year} · ${CO_CTY[c.cty]} · ${VISL[v]}${v!==c.vis?' por el perfil':''}</div></div>

function needsAttn(c){return c.n<9||c.st==='oferta'||c.st==='rev'}
function inMotion(c){return c.st==='oferta'||c.st==='exp'}
function isExposed(c){return effVis(c)!=='priv'}
function whyAttn(c){return c.st==='oferta'?'oferta esperando respuesta':c.n<9?'pasaporte incompleto, '+c.n+' de 9':'documentación en revisión'}
function counter(k,n,l1,l2,col,bg,bd){
 var on=FILT===k;
 return `<button onclick="FILT='${on?'all':k}';go('coleccion')" style="border:1px solid ${on?col:bd};background:${on?bg:'transparent'};border-radius:8px;padding:11px 10px;text-align:left;font:inherit;color:var(--tx)">
  <span style="display:block;font-family:Spectral,serif;font-weight:300;font-size:24px;line-height:1;color:${n?col:'var(--tx3)'}">${n}</span>
  <span style="display:block;font-size:11.5px;line-height:1.35;margin-top:6px;color:${n?col:'var(--tx3)'}">${l1}<br>${l2}</span></button>`}

 var att=CARS.filter(needsAttn).length, mov=CARS.filter(inMotion).length, exp=CARS.filter(isExposed).length;
 var list=CARS.filter(filtFn(FILT));
 var tit=FILT==='all'?'Toda la colección':filtLbl(FILT);
 var vis=ordenar(buscar(list));
 return `<div class="in" style="padding:14px 0 0">
  <div class="k">VALOR CUSTODIADO</div>
  <div onclick="HIDE=!HIDE;go('coleccion')" style="display:flex;align-items:baseline;gap:12px;margin:8px 0 5px;cursor:pointer">

  return n||f[0]==='all'?`<button aria-current="${FILT===f[0]}" onclick="FILT='${f[0]}';go('coleccion')">${f[1]}${f[0]==='all'?'':'<b>'+n+'</b>'}</button>`:''}).join('')}</div>

   oninput="QQ=this.value;clearTimeout(window._qq);window._qq=setTimeout(function(){go('coleccion')},200)">

  <label class="ord">Ordenar<select onchange="SORT=this.value;go('coleccion')">${SORTS.map(function(o){return `<option value="${o[0]}"${SORT===o[0]?' selected':''}>${o[1]}</option>`}).join('')}</select></label>

   :VMODE==='compacto'?vis.map(crow).join('')

  :`<div class="note" style="padding:24px 0">${QQ.trim()?'Ningún coche coincide. <button class="lnk" onclick="QQ=\'\';go(\'coleccion\')">Limpiar la búsqueda</button>':'Nada aquí. Es la buena noticia.'}</div>`}
 ${FILT!=='all'?`<button class="btn quiet" style="margin-top:14px" onclick="FILT='all';go('coleccion')">Ver toda la colección</button>`:''}
 ${FILT==='all'?'<div class="phase">PIEZAS Y COMPONENTES</div>'+PIEZAS.map(prow).join(''):''}
 ${FILT==='all'?'':''}

  <svg viewBox="0 0 18 18" stroke-linecap="round"><path d="M9 3.5v11M3.5 9h11"/></svg>Añadir un coche</button></div>`}};

 if(VORD[destino]>VORD[c.vis]){
  var q=destino==='circ'?'tu círculo':'los miembros verificados que elijas';
  if(!confirm(c.name+' está en '+VISL[c.vis].toLowerCase()+'.\n\nPara esto tiene que verlo '+q+'.\n\nSolo cambia este coche. Tu perfil sigue en '+VISL[PROF].toLowerCase()+', y el resto de la colección no se toca. Dónde está y cuánto vale para ti siguen sin verse.')) return;
 }
 c.pub=1; c.vis=destino; c.st='ok'; sc.salida='';
 alert('Ofertas activadas. Pueden ofertar por '+c.name+' con un mínimo de '+money(v,'EUR')+'. Lo que quede por debajo no te llega.');
 go('pasaporte')}

const TABS=[['co','Mi colección','coleccion'],['ci','Mi círculo','circulo'],['op','Operaciones','operaciones'],['pe','Mi perfil','perfil']];
/* deja la accion principal de cada pantalla fija abajo */
function pinCta(v){
 if(v.querySelector('.cta')) return;
 var prim=[].slice.call(v.querySelectorAll('.btn:not(.quiet)'));
 // fuera los botones de formulario en linea, que van junto a su campo
 prim=prim.filter(function(b){
   if(/width\s*:\s*auto/.test(b.getAttribute('style')||'')) return false;
   var p=b.parentElement;
   // solo se queda en su sitio el boton que va pegado a su campo, en la misma fila
   return !(p&&p!==v&&(p.querySelector(':scope > input')||p.querySelector(':scope > textarea')));
 });
 if(!prim.length) return;
 var b=prim[prim.length-1], node=b;
 while(node.parentElement&&node.parentElement!==v) node=node.parentElement;
 if(node.parentElement!==v) return;
 // solo se ancla un boton suelto o un grupo de botones, nunca una tarjeta con contenido
 if(!node.classList.contains('btn')){
  var bs=[].slice.call(node.querySelectorAll('.btn'));
  if(!bs.length) return;
  var soloBotones=node.textContent.replace(/\s+/g,'')===bs.map(function(x){return x.textContent}).join('').replace(/\s+/g,'');
  if(!soloBotones) return;
 }
 var grupo=[node], nx=node.nextElementSibling;
 while(nx){
  var esAccion=nx.classList.contains('btn')||(nx.querySelector&&nx.querySelector(':scope > .btn'));
  if(!esAccion) break;
  grupo.push(nx); nx=nx.nextElementSibling;
 }
 // las reglas sueltas que queden justo antes sobran
 var pv=node.previousElementSibling;
 if(pv&&pv.classList.contains('rule')) pv.remove();
 var box=document.createElement('div'); box.className='cta';
 grupo.forEach(function(k){box.appendChild(k)});
 v.appendChild(box);
 return true;
}
function go(id){
  const s=S[id],v=document.getElementById('view');
  v.innerHTML=(typeof s.html==='function'?s.html():s.html); v.scrollTop=0;
  const nv=document.getElementById('nav'),sub=typeof s.sub==='function'?s.sub():s.sub;
  nv.style.display=s.bare?'none':'flex';
  nv.innerHTML=s.bare?'':
   (s.back?`<button class="back" onclick="go('${s.back}')" aria-label="Volver">&#8249;</button>`:'')
   +(s.title==='brand'?`<span class="brand">Custodia</span>`:`<span class="title">${s.title}</span>`)
   +(sub?`<span class="sub">${sub}</span>`:'')
   +(s.tab?`<button class="bell" onclick="go('avisos')" aria-label="Avisos">
     <svg viewBox="0 0 18 18" stroke-linecap="round" stroke-linejoin="round">${IC.bell}</svg>${nSin()?`<span class="badge">${nSin()}</span>`:''}</button>`:'');
  const tb=document.getElementById('tabs'),B=badges();
  tb.style.display=s.tab?'flex':'none';
  tb.innerHTML=TABS.map(t=>`<button onclick="go('${t[2]}')" aria-current="${s.tab===t[0]}">
   <span class="ico"><svg viewBox="0 0 18 18" stroke-linecap="round" stroke-linejoin="round">${IC[t[0]]}</svg>${B[t[0]]?`<span class="badge">${B[t[0]]}</span>`:''}</span><span>${t[1]}</span></button>`).join('');
  if(!pinCta(v)) v.insertAdjacentHTML('beforeend','<div style="height:30px"></div>');
  const r=v.querySelectorAll('.reg i');
  if(r.length && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    r.forEach((el,i)=>{const c=el.className;el.className='';setTimeout(()=>el.className=c,120+i*45)});
}
go('splash');
</script>
